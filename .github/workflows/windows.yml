name: 🪟 Windows

on:
  push:
    branches: [development]
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-windows
  cancel-in-progress: true

env:
  # submit build and test results to CDash only for pushes to the mainline development branch
  CDASH_SUBMIT: ${{ github.repository == 'BLAST-ImpactX/impactx' && github.event_name == 'push' && github.ref == 'refs/heads/development' }}

jobs:
  build_win_msvc:
    name: MSVC shared
    runs-on: windows-latest
    if: github.event.pull_request.draft == false
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      name: Install Python
      with:
        python-version: '3.12'
    - name: CCache Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      # - once stored under a key, they become immutable (even if local cache path content changes)
      # - for a refresh the key has to change, e.g., hash of a tracked file in the key
      with:
        path: |
          ~/.ccache
          ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-
    - name: Download Dependencies
      run: |
        Invoke-WebRequest http://fftw.org/fftw-3.3.11.tar.gz -OutFile fftw-3.3.11.tar.gz
        7z.exe x -r fftw-3.3.11.tar.gz
        7z.exe x -r fftw-3.3.11.tar

        Invoke-WebRequest https://github.com/HDFGroup/hdf5/archive/refs/tags/hdf5-1_12_2.tar.gz -OutFile hdf5-1_12_2.tar.gz
        7z.exe x -r hdf5-1_12_2.tar.gz
        7z.exe x -r hdf5-1_12_2.tar
    - name: Install Dependencies
      env:
        # Work-around for windows-latest GH runner issue, see
        # https://github.com/actions/runner-images/issues/10004
        CFLAGS: "/arch:AVX2"
        CXXFLAGS: "/D_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR /arch:AVX2"
      run: |
        cmake -S fftw-3.3.11                     `
              -B build_fftw                      `
              -DBUILD_SHARED_LIBS=OFF            `
              -DBUILD_TESTS=OFF                  `
              -DCMAKE_BUILD_TYPE=RelWithDebInfo  `
              -DCMAKE_POLICY_VERSION_MINIMUM="3.5" `
              -DDISABLE_FORTRAN=ON
        if(!$?) { Exit $LASTEXITCODE }
        cmake --build build_fftw --config RelWithDebInfo --target install --parallel 4
        if(!$?) { Exit $LASTEXITCODE }
        cmake -S fftw-3.3.11                     `
              -B build_fftwf                     `
              -DBUILD_SHARED_LIBS=OFF            `
              -DBUILD_TESTS=OFF                  `
              -DCMAKE_BUILD_TYPE=RelWithDebInfo  `
              -DCMAKE_POLICY_VERSION_MINIMUM="3.5" `
              -DDISABLE_FORTRAN=ON               `
              -DENABLE_FLOAT=ON
        if(!$?) { Exit $LASTEXITCODE }
        cmake --build build_fftwf --config RelWithDebInfo --target install --parallel 4
        if(!$?) { Exit $LASTEXITCODE }

        cmake -S hdf5-hdf5-1_12_2 -B build_hdf5  `
              -DCMAKE_BUILD_TYPE=RelWithDebInfo  `
              -DBUILD_SHARED_LIBS=OFF            `
              -DBUILD_TESTING=OFF                `
              -DHDF5_BUILD_HL_LIB=OFF            `
              -DHDF5_BUILD_TOOLS=OFF             `
              -DHDF5_BUILD_EXAMPLES=OFF          `
              -DHDF5_ENABLE_SZIP_SUPPORT=OFF     `
              -DHDF5_ENABLE_Z_LIB_SUPPORT=OFF
        if(!$?) { Exit $LASTEXITCODE }
        cmake --build build_hdf5 --config RelWithDebInfo --target install --parallel 4
        if(!$?) { Exit $LASTEXITCODE }

        $env:HDF5_DIR = "C:/Program Files/HDF_Group/HDF5/1.12.2/cmake/"
        $env:HDF5_USE_STATIC_LIBRARIES = "ON"

        python3 -m pip install -U pip
        python3 -m pip install -U build packaging setuptools[core] wheel
        python3 -m pip install -U -r requirements.txt
        python3 -m pip install -U -r src/python/impactx/dashboard/requirements.txt
        python3 -m pip install -U -r examples/requirements.txt
        python3 -m pip install -U -r tests/python/requirements.txt
        python3 -m pip install -U openPMD-validator
    - name: Build
      env:
        # Work-around for windows-latest GH runner issue, see
        # https://github.com/actions/runner-images/issues/10004
        CFLAGS: "/arch:AVX2"
        CXXFLAGS: "/D_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR /arch:AVX2"
        # FFTW3 install prefix path
        FFTW3_DIR: "C:/Program Files (x86)/fftw/"
        FFTW3f_DIR: "C:/Program Files (x86)/fftw/"
      run: |
        $env:HDF5_DIR = "C:/Program Files/HDF_Group/HDF5/1.12.2/cmake/"
        cmake -S . -B build               `
              -DBUILDNAME=Windows-MSVC-DP-NOACC `
              -DSITE=GitHub               `
              -DBUILD_SHARED_LIBS=ON      `
              -DCMAKE_BUILD_TYPE=RelWithDebInfo  `
              -DCMAKE_VERBOSE_MAKEFILE=ON    `
              -DHDF5_USE_STATIC_LIBRARIES=ON `
              -DImpactX_COMPUTE=NOACC     `
              -DImpactX_FFT=ON            `
              -DImpactX_MPI=OFF           `
              -DImpactX_PYTHON=ON         `
              -DImpactX_TEST_CLEANUP=ON   `
              -DopenPMD_USE_HDF5=ON       `
              -DPython_EXECUTABLE=python3
        if(!$?) { Exit $LASTEXITCODE }
        # records build time and warnings for CDash; exits 0 even if the build fails
        ctest --test-dir build --build-config RelWithDebInfo -D ExperimentalBuild -V
        if(!$?) { Exit $LASTEXITCODE }
        cmake --build build --config RelWithDebInfo  # authoritative pass/fail (no-op if the build above succeeded)
        if(!$?) { Exit $LASTEXITCODE }
    - name: Test
      run: |
        ctest --test-dir build --build-config RelWithDebInfo -D ExperimentalTest --output-on-failure -E AMReX --label-exclude "dashboard"
        if(!$?) { Exit $LASTEXITCODE }
    - name: submit to CDash
      if: ${{ !cancelled() && env.CDASH_SUBMIT == 'true' && hashFiles('build/DartConfiguration.tcl') != '' }}
      continue-on-error: true
      run: |
        ctest --test-dir build -D ExperimentalSubmit
        if(!$?) { Exit $LASTEXITCODE }
    - name: Install
      run: |
        cmake --build build --config RelWithDebInfo --target install
        if(!$?) { Exit $LASTEXITCODE }
        cmake --build build --config RelWithDebInfo --target pip_install
        if(!$?) { Exit $LASTEXITCODE }
    - name: validate created openPMD files
      run: Get-ChildItem -Path build -Recurse -Filter *.h5 | %{openPMD_check_h5 -i $_}

  build_win_clang:
    name: Clang w/ OMP
    runs-on: windows-2025
    if: github.event.pull_request.draft == false
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      name: Install Python
      with:
        python-version: '3.11'
    - name: CCache Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      # - once stored under a key, they become immutable (even if local cache path content changes)
      # - for a refresh the key has to change, e.g., hash of a tracked file in the key
      with:
        path: |
          ~/.ccache
          ~/.cache/ccache
        key: ccache-windows-winclang-${{ hashFiles('.github/workflows/windows.yml') }}-${{ hashFiles('cmake/dependencies/ABLASTR.cmake') }}
        restore-keys: |
          ccache-windows-winclang-${{ hashFiles('.github/workflows/windows.yml') }}-
          ccache-windows-winclang-
    - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6
    - name: Download Dependencies
      run: |
        Invoke-WebRequest http://fftw.org/fftw-3.3.11.tar.gz -OutFile fftw-3.3.11.tar.gz
        7z.exe x -r fftw-3.3.11.tar.gz
        7z.exe x -r fftw-3.3.11.tar

        Invoke-WebRequest https://github.com/HDFGroup/hdf5/archive/refs/tags/hdf5-1_12_2.tar.gz -OutFile hdf5-1_12_2.tar.gz
        7z.exe x -r hdf5-1_12_2.tar.gz
        7z.exe x -r hdf5-1_12_2.tar
    - name: Install Dependencies
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\vc\Auxiliary\build\vcvarsall.bat" x64

        cmake -S fftw-3.3.11                     ^
              -B build_fftw                      ^
              -G "Ninja"                         ^
              -DBUILD_TESTS=OFF                  ^
              -DBUILD_SHARED_LIBS=OFF            ^
              -DCMAKE_BUILD_TYPE=Debug           ^
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ^
              -DDISABLE_FORTRAN=ON               ^
              -DENABLE_OPENMP=ON
        if errorlevel 1 exit 1
        cmake --build build_fftw --config Debug --target install --parallel 4
        if errorlevel 1 exit 1
        cmake -S fftw-3.3.11                     ^
              -B build_fftwf                     ^
              -G "Ninja"                         ^
              -DBUILD_TESTS=OFF                  ^
              -DBUILD_SHARED_LIBS=OFF            ^
              -DCMAKE_BUILD_TYPE=Debug           ^
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ^
              -DDISABLE_FORTRAN=ON               ^
              -DENABLE_FLOAT=ON                  ^
              -DENABLE_OPENMP=ON
        if errorlevel 1 exit 1
        cmake --build build_fftwf --config Debug --target install --parallel 4
        if errorlevel 1 exit 1

        cmake -S hdf5-hdf5-1_12_2 -B build_hdf5 ^
            -T "ClangCl"                        ^
            -DBUILD_SHARED_LIBS=OFF             ^
            -DBUILD_TESTING=OFF                 ^
            -DCMAKE_BUILD_TYPE=Debug            ^
            -DHDF5_BUILD_HL_LIB=OFF             ^
            -DHDF5_BUILD_TOOLS=OFF              ^
            -DHDF5_BUILD_EXAMPLES=OFF           ^
            -DHDF5_ENABLE_SZIP_SUPPORT=OFF      ^
            -DHDF5_ENABLE_Z_LIB_SUPPORT=OFF
        if errorlevel 1 exit 1
        cmake --build build_hdf5 --config Debug --target install --parallel 4
        if errorlevel 1 exit 1

        set "HDF5_DIR=C:/Program Files/HDF_Group/HDF5/1.12.2/cmake/"
        set "HDF5_USE_STATIC_LIBRARIES=ON"

        python3 -m pip install -U pip
        python3 -m pip install -U build packaging setuptools[core] wheel
        python3 -m pip install -U -r requirements.txt
        python3 -m pip install -U -r src/python/impactx/dashboard/requirements.txt
        python3 -m pip install -U -r examples/requirements.txt
        python3 -m pip install -U -r tests/python/requirements.txt
        python3 -m pip install -U openPMD-validator
    - name: Build
      shell: cmd
      env:
        # Dependency install prefix path
        FFTW3_DIR: "C:/Program Files (x86)/fftw/"
        FFTW3f_DIR: "C:/Program Files (x86)/fftw/"
        HDF5_DIR: "C:/Program Files/HDF_Group/HDF5/1.12.2/cmake/"
      run: |
        call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\vc\Auxiliary\build\vcvarsall.bat" x64

        cmake -S . -B build                  ^
              -T "ClangCl"                   ^
              -DBUILDNAME=Windows-ClangCl-DP-OMP-Debug ^
              -DSITE=GitHub                  ^
              -DCMAKE_BUILD_TYPE=Debug       ^
              -DBUILD_SHARED_LIBS=OFF        ^
              -DCMAKE_VERBOSE_MAKEFILE=ON    ^
              -DHDF5_USE_STATIC_LIBRARIES=ON ^
              -DImpactX_COMPUTE=OMP          ^
              -DImpactX_FFT=ON               ^
              -DImpactX_MPI=OFF              ^
              -DImpactX_PYTHON=ON            ^
              -DImpactX_TEST_CLEANUP=ON      ^
              -DopenPMD_USE_HDF5=ON
        if errorlevel 1 exit 1
        REM records build time and warnings for CDash; exits 0 even if the build fails
        ctest --test-dir build -C Debug -D ExperimentalBuild -V
        if errorlevel 1 exit 1
        REM authoritative pass/fail (no-op if the build above succeeded)
        cmake --build build --config Debug
        if errorlevel 1 exit 1
        cmake --build build --config Debug --target install
        if errorlevel 1 exit 1
        cmake --build build --config Debug --target pip_install
        if errorlevel 1 exit 1

#    - name: Setup tmate session
#      uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24

    - name: Test Simple
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\vc\Auxiliary\build\vcvarsall.bat" x64
        set "PATH=C:/Program Files (x86)/ImpactX/bin/;%PATH%"
        python3 examples/fodo/run_fodo.py
        if errorlevel 1 exit 1

    - name: Test
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\vc\Auxiliary\build\vcvarsall.bat" x64
        ctest --test-dir build -C Debug -D ExperimentalTest --output-on-failure -E AMReX --label-exclude "dashboard"
        if errorlevel 1 exit 1

    - name: submit to CDash
      if: ${{ !cancelled() && env.CDASH_SUBMIT == 'true' && hashFiles('build/DartConfiguration.tcl') != '' }}
      continue-on-error: true
      run: |
        ctest --test-dir build -D ExperimentalSubmit
        if(!$?) { Exit $LASTEXITCODE }

