name: 🐧 OpenMP

on:
  push:
    branches: [development]
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-ubuntu
  cancel-in-progress: true

permissions:
  contents: read   # required for actions/checkout
  id-token: write  # required for OIDC authentication with CodSpeed

env:
  # submit build and test results to CDash only for pushes to the mainline development branch
  CDASH_SUBMIT: ${{ github.repository == 'BLAST-ImpactX/impactx' && github.event_name == 'push' && github.ref == 'refs/heads/development' }}

jobs:
  build_gcc:
    name: GCC w/ MPI w/ Python
    runs-on: ubuntu-22.04
    if: github.event.pull_request.draft == false
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CMAKE_GENERATOR: Ninja
      CXXFLAGS: "-Werror"
      OMP_NUM_THREADS: 2
    steps:
    - name: Free More Disk Space
      uses: ax3l/free-disk-space@44eeae95a80954c3eb6161397b5b201b22e178cc # main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: false  # apt takes ~1:30min
        docker-images: true
        swap-storage: false

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"

    - name: install dependencies
      run: |
        .github/workflows/dependencies/gcc-openmpi.sh

    - name: install optimizer dependencies (covers optional tests)
      run: |
        python3 -m pip install -U -r examples/requirements_optimizer.txt

    - name: CCache Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      # - once stored under a key, they become immutable (even if local cache path content changes)
      # - for a refresh the key has to change, e.g., hash of a tracked file in the key
      with:
        path: |
          ~/.ccache
          ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-

    - name: system info
      run: |
        cat /proc/cpuinfo
        lscpu

    - name: build ImpactX
      run: |
        cmake -S . -B build            \
          -DBUILDNAME=Linux-GCC-DP-MPI-Debug \
          -DSITE=GitHub                \
          -DCMAKE_BUILD_TYPE=Debug     \
          -DBUILD_SHARED_LIBS=ON       \
          -DCMAKE_INSTALL_PREFIX=$HOME/.local  \
          -DCMAKE_VERBOSE_MAKEFILE=ON  \
          -DImpactX_FFT=ON             \
          -DImpactX_PYTHON=ON          \
          -DImpactX_SYNMADX=ON         \
          -DImpactX_TEST_CLEANUP=ON    \
          -DImpactX_UNITY_BUILD=ON     \
          -DMPIEXEC_POSTFLAGS="--use-hwthread-cpus"
        # records build time and warnings for CDash; exits 0 even if the build fails
        ctest --test-dir build -D ExperimentalBuild -V
        cmake --build build  # authoritative pass/fail (no-op if the build above succeeded)

    - name: run tests
      run: |
        ctest --test-dir build -D ExperimentalTest --output-on-failure --label-exclude slow -E pytest.AMReX

    - name: submit to CDash
      if: ${{ !cancelled() && env.CDASH_SUBMIT == 'true' && hashFiles('build/DartConfiguration.tcl') != '' }}
      continue-on-error: true
      run: ctest --test-dir build -D ExperimentalSubmit

    - name: Upload dashboard screenshots
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dashboard-screenshots-${{ github.job }}
        path: |
          build/**/pytest.ImpactX.dashboard/screenshots/**/*.png
          build/**/screenshots/**/*.png
        if-no-files-found: ignore

    - name: run installed app
      run: |
        cmake --build build --target install
        export PATH=$HOME/.local/bin:$PATH
        export LD_LIBRARY_PATH=$HOME/.local/lib:$LD_LIBRARY_PATH

        impactx.MPI.OMP.DP.OPMD.DEBUG examples/fodo/input_fodo.in algo.particle_shape = 1 || \
        { cat Backtrace.0.0; exit 1; }
        impactx.MPI.OMP.DP.OPMD.DEBUG examples/fodo/input_fodo.in algo.particle_shape = 2 || \
        { cat Backtrace.0.0; exit 1; }
        impactx.MPI.OMP.DP.OPMD.DEBUG examples/fodo/input_fodo.in algo.particle_shape = 3 || \
        { cat Backtrace.0.0; exit 1; }

    - name: run installed python module
      run: |
        cmake --build build --target pip_install

        python3 examples/fodo/run_fodo.py

    - name: validate created openPMD files
      run: find build -name *.h5 | xargs -n1 -I{} openPMD_check_h5 -i {}

  build_gcc_python:
    name: GCC w/ SIMD w/o MPI w/ Python
    runs-on: ubuntu-24.04
    if: github.event.pull_request.draft == false
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CMAKE_GENERATOR: Ninja
      CXXFLAGS: "-Werror -march=x86-64-v3 -mtune=generic"
      OMP_NUM_THREADS: 2
    steps:
    - name: system info
      run: |
        cat /proc/cpuinfo
        lscpu
        grep -q '\bavx2\b' /proc/cpuinfo || { echo "runner lacks AVX2"; exit 1; }

    - name: Free More Disk Space
      uses: ax3l/free-disk-space@44eeae95a80954c3eb6161397b5b201b22e178cc # main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: false  # apt takes ~1:30min
        docker-images: true
        swap-storage: false

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.13"

    - name: install dependencies
      run: |
        .github/workflows/dependencies/gcc.sh

    - name: CCache Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      # - once stored under a key, they become immutable (even if local cache path content changes)
      # - for a refresh the key has to change, e.g., hash of a tracked file in the key
      with:
        path: |
          ~/.ccache
          ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-

    - name: build ImpactX
      run: |
        cmake -S . -B build            \
          -DBUILDNAME=Linux-GCC-DP-SIMD \
          -DSITE=GitHub                \
          -DBUILD_SHARED_LIBS=ON       \
          -DCMAKE_BUILD_TYPE=Release   \
          -DCMAKE_INSTALL_PREFIX=$HOME/.local  \
          -DCMAKE_VERBOSE_MAKEFILE=ON  \
          -DImpactX_FFT=ON             \
          -DImpactX_MPI=OFF            \
          -DImpactX_PYTHON=ON          \
          -DImpactX_SIMD=ON            \
          -DImpactX_SYNMADX=ON         \
          -DImpactX_TEST_CLEANUP=ON
        # records build time and warnings for CDash; exits 0 even if the build fails
        ctest --test-dir build -D ExperimentalBuild -V
        cmake --build build  # authoritative pass/fail (no-op if the build above succeeded)

    - name: run tests
      run: |
        ctest --test-dir build -D ExperimentalTest --output-on-failure --label-exclude slow -E pytest.AMReX

    - name: submit to CDash
      if: ${{ !cancelled() && env.CDASH_SUBMIT == 'true' && hashFiles('build/DartConfiguration.tcl') != '' }}
      continue-on-error: true
      run: ctest --test-dir build -D ExperimentalSubmit

    - name: Upload dashboard screenshots
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dashboard-screenshots-${{ github.job }}
        path: |
          build/**/pytest.ImpactX.dashboard/screenshots/**/*.png
          build/**/screenshots/**/*.png
        if-no-files-found: ignore

    - name: run installed app
      run: |
        cmake --build build --target install
        export PATH=$HOME/.local/bin:$PATH
        export LD_LIBRARY_PATH=$HOME/.local/lib:$LD_LIBRARY_PATH

        impactx.NOMPI.OMP.DP.OPMD examples/fodo/input_fodo.in algo.particle_shape = 1 || \
        { cat Backtrace.0.0; exit 1; }
        impactx.NOMPI.OMP.DP.OPMD examples/fodo/input_fodo.in algo.particle_shape = 2 || \
        { cat Backtrace.0.0; exit 1; }
        impactx.NOMPI.OMP.DP.OPMD examples/fodo/input_fodo.in algo.particle_shape = 3 || \
        { cat Backtrace.0.0; exit 1; }

    - name: run installed python module
      run: |
        cmake --build build --target pip_install

        python3 examples/fodo/run_fodo.py

    - name: Python CodSpeedHQ Benchmarks
      uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
      env:
        OMP_NUM_THREADS: 1
        IS_CODESPEED_CPU_SIMULATION: 1
        # Force uniform glibc CPU dispatch so malloc/memcpy behave identically across Intel/AMD runner CPUs
        # Ref: https://codspeed.io/blog/why-glibc-faster-github-actions
        # Note that we keep AVX2, which is a subset of -march=x86-64-v3, and present on all GH Ubuntu runners.
        # Adding instead skip for AVX512 to guard against newer runners.
        GLIBC_TUNABLES: glibc.cpu.hwcaps=-AVX512F,-AVX512VL,-AVX512BW,-AVX512DQ,-AVX_Fast_Unaligned_Load,-ERMS,-Prefer_FSRM
      with:
        mode: simulation
        # v5 enabled cycle estimation by default, which re-weights the simulated
        # cache/memory terms until they are ~90% of the reported number. Those terms
        # are code/data-layout sensitive, so unrelated commits swing the result by
        # tens of percent while the instruction count moves by less than 0.1%.
        cycle-estimation: false
        exclude-allocations: true
        run: pytest tests/python/test_benchmark_elements.py tests/python/test_benchmark_space_charge.py tests/python/test_benchmark_diagnostics.py --codspeed

    - name: validate created openPMD files
      run: find build -name *.h5 | xargs -n1 -I{} openPMD_check_h5 -i {}

  build_gcc_sp:
    name: GCC SP w/ SIMD w/ MPI w/ Python
    runs-on: ubuntu-24.04
    if: github.event.pull_request.draft == false
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CMAKE_GENERATOR: Ninja
      # same x86-64 microarchitecture level (AVX2 + FMA) as the conda-forge packages
      CXXFLAGS: "-Werror -march=x86-64-v3 -mtune=generic"
      OMP_NUM_THREADS: 2
    steps:
    - name: system info
      run: |
        cat /proc/cpuinfo
        lscpu
        grep -q '\bavx2\b' /proc/cpuinfo || { echo "runner lacks AVX2"; exit 1; }

    - name: Free More Disk Space
      uses: ax3l/free-disk-space@44eeae95a80954c3eb6161397b5b201b22e178cc # main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: false  # apt takes ~1:30min
        docker-images: true
        swap-storage: false

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: install dependencies
      run: |
        .github/workflows/dependencies/gcc-openmpi.sh
        .github/workflows/dependencies/vir-simd.sh

    - name: install optimizer dependencies (covers optional tests)
      run: |
        python3 -m pip install -U -r examples/requirements_optimizer.txt

    - name: CCache Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      # - once stored under a key, they become immutable (even if local cache path content changes)
      # - for a refresh the key has to change, e.g., hash of a tracked file in the key
      with:
        path: |
          ~/.ccache
          ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-

    - name: build ImpactX
      # same precision and math options as the single-precision conda-forge packages
      run: |
        cmake -S . -B build            \
          -DBUILDNAME=Linux-GCC-SP-SIMD-MPI \
          -DSITE=GitHub                \
          -DBUILD_SHARED_LIBS=ON       \
          -DCMAKE_BUILD_TYPE=Release   \
          -DCMAKE_INSTALL_PREFIX=$HOME/.local  \
          -DCMAKE_VERBOSE_MAKEFILE=ON  \
          -DImpactX_FASTMATH=ON        \
          -DImpactX_FFT=ON             \
          -DImpactX_PRECISION=SINGLE   \
          -DImpactX_PYTHON=ON          \
          -DImpactX_SIMD=ON            \
          -DImpactX_SYNMADX=ON         \
          -DImpactX_TEST_CLEANUP=ON    \
          -DMPIEXEC_POSTFLAGS="--use-hwthread-cpus"
        # records build time and warnings for CDash; exits 0 even if the build fails
        ctest --test-dir build -D ExperimentalBuild -V
        cmake --build build  # authoritative pass/fail (no-op if the build above succeeded)

    - name: run tests
      run: |
        ctest --test-dir build -D ExperimentalTest --output-on-failure --label-exclude slow -E pytest.AMReX

    - name: submit to CDash
      if: ${{ !cancelled() && env.CDASH_SUBMIT == 'true' && hashFiles('build/DartConfiguration.tcl') != '' }}
      continue-on-error: true
      run: ctest --test-dir build -D ExperimentalSubmit

    - name: Upload dashboard screenshots
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dashboard-screenshots-${{ github.job }}
        path: |
          build/**/pytest.ImpactX.dashboard/screenshots/**/*.png
          build/**/screenshots/**/*.png
        if-no-files-found: ignore

    - name: run installed app
      run: |
        cmake --build build --target install
        export PATH=$HOME/.local/bin:$PATH
        export LD_LIBRARY_PATH=$HOME/.local/lib:$LD_LIBRARY_PATH

        impactx.MPI.OMP.SP.OPMD examples/fodo/input_fodo.in || \
        { cat Backtrace.0.0; exit 1; }

    - name: run installed python module
      run: |
        cmake --build build --target pip_install

        python3 examples/fodo/run_fodo.py

    - name: validate created openPMD files
      run: find build -name *.h5 | xargs -n1 -I{} openPMD_check_h5 -i {}
