name: 🐧 HIP

on:
  push:
    branches: [development]
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-hip
  cancel-in-progress: true

env:
  # submit build results to CDash only for pushes to the mainline development branch
  CDASH_SUBMIT: ${{ github.repository == 'BLAST-ImpactX/impactx' && github.event_name == 'push' && github.ref == 'refs/heads/development' }}

jobs:
  build_hip:
    name: HIP
    runs-on: ubuntu-24.04
    env:
      CXXFLAGS: "-Werror -Wno-deprecated-declarations -Wno-error=pass-failed"
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CMAKE_GENERATOR: Ninja
    if: github.event.pull_request.draft == false
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: install dependencies
      shell: bash
      run: .github/workflows/dependencies/hip-openmpi.sh 6.3.2

    - name: CCache Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      # - once stored under a key, they become immutable (even if local cache path content changes)
      # - for a refresh the key has to change, e.g., hash of a tracked file in the key
      with:
        path: |
          ~/.ccache
          ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-

    - name: build ImpactX
      shell: bash
      run: |
        source /etc/profile.d/rocm.sh
        hipcc --version
        which clang
        which clang++
        export CXX=$(which clang++)
        export CC=$(which clang)

        cmake -S . -B build \
          -DBUILDNAME=Linux-ROCm-HIP-DP \
          -DSITE=GitHub               \
          -DCMAKE_VERBOSE_MAKEFILE=ON \
          -DAMReX_AMD_ARCH=gfx900     \
          -DImpactX_COMPUTE=HIP       \
          -DImpactX_FFT=ON            \
          -DImpactX_PYTHON=ON
        # records build time and warnings for CDash; exits 0 even if the build fails
        ctest --test-dir build -D ExperimentalBuild -V
        cmake --build build  # authoritative pass/fail (no-op if the build above succeeded)

    - name: submit to CDash
      if: ${{ !cancelled() && env.CDASH_SUBMIT == 'true' && hashFiles('build/DartConfiguration.tcl') != '' }}
      continue-on-error: true
      run: ctest --test-dir build -D ExperimentalSubmit
