name: 🐧 CUDA

on:
  push:
    branches: [development]
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-cuda
  cancel-in-progress: true

env:
  # submit build results to CDash only for pushes to the mainline development branch
  CDASH_SUBMIT: ${{ github.repository == 'BLAST-ImpactX/impactx' && github.event_name == 'push' && github.ref == 'refs/heads/development' }}

jobs:
# Ref.:
#   https://gitlab.com/nvidia/container-images/cuda/-/blob/master/dist/ubuntu18.04/10.1/base/Dockerfile
#   https://github.com/ComputationalRadiationPhysics/picongpu/blob/0.5.0/share/picongpu/dockerfiles/ubuntu-1604/Dockerfile
#   https://developer.download.nvidia.com/compute/cuda/repos/ubuntu1804/x86_64/
  build_nvcc:
    name: NVCC SP
    runs-on: ubuntu-22.04
    if: github.event.pull_request.draft == false
    env:
      CXXFLAGS: "-Werror"
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CMAKE_GENERATOR: Ninja
    steps:
    - name: Free More Disk Space
      uses: ax3l/free-disk-space@44eeae95a80954c3eb6161397b5b201b22e178cc # main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: false  # apt takes ~1:30min
        docker-images: true
        swap-storage: false

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: install dependencies
      run: |
        .github/workflows/dependencies/nvcc12-openmpi.sh

    - name: CCache Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      # - once stored under a key, they become immutable (even if local cache path content changes)
      # - for a refresh the key has to change, e.g., hash of a tracked file in the key
      with:
        path: |
          ~/.ccache
          ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-

    - name: build ImpactX
      run: |
        export PATH=/usr/local/nvidia/bin:/usr/local/cuda/bin:${PATH}
        export LD_LIBRARY_PATH=/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64:${LD_LIBRARY_PATH}
        which nvcc || echo "nvcc not in PATH!"

        cmake -S . -B build            \
          -DBUILDNAME=Linux-NVCC-CUDA-SP \
          -DSITE=GitHub                \
          -DCMAKE_VERBOSE_MAKEFILE=ON  \
          -DImpactX_COMPUTE=CUDA       \
          -DImpactX_FFT=ON             \
          -DImpactX_PYTHON=ON          \
          -DCMAKE_CUDA_ARCHITECTURES=60 \
          -DImpactX_PRECISION=SINGLE   \
          -DAMReX_CUDA_ERROR_CROSS_EXECUTION_SPACE_CALL=ON \
          -DAMReX_CUDA_ERROR_CAPTURE_THIS=ON
        # records build time and warnings for CDash; exits 0 even if the build fails
        ctest --test-dir build -D ExperimentalBuild -V
        cmake --build build  # authoritative pass/fail (no-op if the build above succeeded)

    - name: submit to CDash
      if: ${{ !cancelled() && env.CDASH_SUBMIT == 'true' && hashFiles('build/DartConfiguration.tcl') != '' }}
      continue-on-error: true
      run: ctest --test-dir build -D ExperimentalSubmit
