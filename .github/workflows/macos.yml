name: 🍏 macOS

on:
  push:
    branches: [development]
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-macos
  cancel-in-progress: true

env:
  # submit build and test results to CDash only for pushes to the mainline development branch
  CDASH_SUBMIT: ${{ github.repository == 'BLAST-ImpactX/impactx' && github.event_name == 'push' && github.ref == 'refs/heads/development' }}

jobs:
  build_appleclang:
    name: AppleClang
    runs-on: macos-latest
    if: github.event.pull_request.draft == false
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: TRUE
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      name: Install Python
      with:
        python-version: '3.x'
    - name: install brew dependencies
      run: |
        set +e
        brew unlink gcc
        brew update
        brew install adios2
        brew install ccache
        brew install cmake
        brew install fftw
        brew install hdf5-mpi
        brew install libomp
        brew link --overwrite --force libomp
        brew install ninja
        brew install open-mpi
        brew install pkg-config
        set -e
    - name: install vir-simd
      run: .github/workflows/dependencies/vir-simd.sh
    - name: install pip dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --upgrade build packaging setuptools[core] wheel pytest pytest-benchmark
        python3 -m pip install --upgrade -r requirements_mpi.txt
        python3 -m pip install --upgrade -r src/python/impactx/dashboard/requirements.txt
        python3 -m pip install --upgrade -r examples/requirements.txt
        python3 -m pip install --upgrade -r tests/python/requirements.txt
        python3 -m pip install --upgrade pipx
        python3 -m pipx install openPMD-validator
    - name: CCache Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      # - once stored under a key, they become immutable (even if local cache path content changes)
      # - for a refresh the key has to change, e.g., hash of a tracked file in the key
      with:
        path: /Users/runner/Library/Caches/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-
    - name: build ImpactX
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=100M
        export CCACHE_SLOPPINESS=time_macros
        ccache -z

        export CXXFLAGS="-Werror -Wno-error=pass-failed"

        cmake -S . -B build            \
          -DBUILDNAME=macOS-AppleClang-DP-SIMD-MPI \
          -DSITE=GitHub                \
          -DCMAKE_VERBOSE_MAKEFILE=ON  \
          -DImpactX_FFT=ON             \
          -DImpactX_PYTHON=ON          \
          -DImpactX_SIMD=ON            \
          -DImpactX_TEST_CLEANUP=ON
        # records build time and warnings for CDash; exits 0 even if the build fails
        ctest --test-dir build -D ExperimentalBuild -V
        cmake --build build  # authoritative pass/fail (no-op if the build above succeeded)

        du -hs ~/Library/Caches/ccache
        ccache -s

    - name: run tests
      run: |
        ctest --test-dir build -D ExperimentalTest --output-on-failure -E pytest.AMReX

    - name: submit to CDash
      if: ${{ !cancelled() && env.CDASH_SUBMIT == 'true' && hashFiles('build/DartConfiguration.tcl') != '' }}
      continue-on-error: true
      run: ctest --test-dir build -D ExperimentalSubmit

    - name: Upload dashboard screenshots
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dashboard-screenshots-${{ github.job }}
        path: |
          build/**/pytest.ImpactX.dashboard/screenshots/**/*.png
          build/**/screenshots/**/*.png
        if-no-files-found: ignore

    - name: run installed python module
      run: |
        cmake --build build --target pip_install

        python3 examples/fodo/run_fodo.py

    - name: run installed app
      run: |
        sudo cmake --build build --target install

        export DYLD_LIBRARY_PATH=/usr/local/lib:${DYLD_LIBRARY_PATH}

        impactx.MPI.OMP.DP.OPMD examples/fodo/input_fodo.in algo.particle_shape = 1 || \
        { cat Backtrace.0.0; exit 1; }
        impactx.MPI.OMP.DP.OPMD examples/fodo/input_fodo.in algo.particle_shape = 2 || \
        { cat Backtrace.0.0; exit 1; }
        impactx.MPI.OMP.DP.OPMD examples/fodo/input_fodo.in algo.particle_shape = 3 || \
        { cat Backtrace.0.0; exit 1; }

    - name: validate created openPMD files
      run: find build -name *.h5 | xargs -n1 -I{} openPMD_check_h5 -i {}
