name: 🔄 Update Stub Files

on:
  push:
    branches: [development]
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-subs
  cancel-in-progress: true

jobs:
  # Build and install libamrex as AMReX CMake project
  stubs:
    name: Stubs
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
      CXXFLAGS: "-O1"
      OMP_NUM_THREAD: 4

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: github.event_name != 'push' || github.repository != 'BLAST-ImpactX/impactx' || github.ref != 'refs/heads/development'

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: github.event_name == 'push' && github.repository == 'BLAST-ImpactX/impactx' && github.ref == 'refs/heads/development'
      with:
        token: ${{ secrets.IMPACTX_PUSH_TOKEN }}

    - name: Pull Remote Changes
      if: github.event_name == 'push' && github.repository == 'BLAST-ImpactX/impactx' && github.ref == 'refs/heads/development'
      run: git pull

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      name: Install Python
      with:
        python-version: '3.13'

    - name: Dependencies
      run: |
        .github/workflows/dependencies/gcc-openmpi.sh
        python3 -m pip install -U "pybind11-stubgen==3.0.0" pre-commit

    - name: Set Up Cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-

    - name: Build & Install
      run: |
        export CCACHE_COMPRESS=1
        export CCACHE_COMPRESSLEVEL=10
        export CCACHE_MAXSIZE=200M
        ccache -z

        cmake -S . -B build            \
          -DCMAKE_VERBOSE_MAKEFILE=ON  \
          -DImpactX_FFT=ON             \
          -DImpactX_PYTHON=ON          \
          -DMPIEXEC_POSTFLAGS="--use-hwthread-cpus"
        cmake --build build -j 4 --target pip_install

        ccache -s
        du -hs ~/.cache/ccache

    - name: Update Stubs
      run: |
        .github/update_stub.sh

    - name: Run pre-commit cleanup
      run: |
        git add .
        pre-commit run -a || true
        git add .

    - name: Update Install
      run: |
        cmake --build build -j 4 --target pip_install

    - name: Unit tests
      run: |
        mpiexec -np 1 python3 -m pytest tests/python/ --ignore=tests/python/dashboard

    - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
      name: Commit Updated Stub Files
      if: github.event_name == 'push' && github.repository == 'BLAST-ImpactX/impactx' && github.ref == 'refs/heads/development'
      with:
        commit_message: Update Stub Files
